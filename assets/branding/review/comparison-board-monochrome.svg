<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <style>
      .mono-bg { fill: #FFFFFF; }
      .mono-title { font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700; fill: #000000; }
      .mono-sub { font-family: 'DM Sans', sans-serif; font-size: 13px; fill: #4B5563; }
      .mono-card { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1.5; rx: 10; }
      .col-mono-hdr { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; fill: #000000; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1000" height="520" class="mono-bg" />

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" class="mono-title">NAVA CREATIONS — Monochrome (100% Black) Reproduction Audit</text>
    <text x="0" y="24" class="mono-sub">Single-Ink Utility Verification for 203 DPI Thermal Shipping Labels, Monochrome GST Tax Invoices, and Laser Engraving</text>
  </g>

  <!-- COLUMN 1: CONCEPT A MONOCHROME -->
  <g transform="translate(50, 95)">
    <rect width="280" height="380" rx="10" class="mono-card" />
    <text x="140" y="32" class="col-mono-hdr">CONCEPT A (PARIJATA)</text>

    <!-- Simulated Thermal Shipping Label Area -->
    <rect x="20" y="55" width="240" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="2 2" />

    <g transform="translate(140, 145) scale(0.60)">
      <circle cx="0" cy="-60" r="5" fill="#000000" />
      <path d="M 0 -64.5 C -7 -78, -3 -88, 0 -94 C 3 -88, 7 -78, 0 -64.5 Z" stroke="#000000" stroke-width="2.5" fill="none" />
      <path d="M 4 -62 C 18 -69, 28 -65, 32 -61 C 27 -56, 17 -55, 4 -62 Z" stroke="#000000" stroke-width="2.5" fill="none" />
      <path d="M 3 -57 C 14 -46, 20 -38, 19 -33 C 15 -34, 8 -43, 3 -57 Z" stroke="#000000" stroke-width="2.5" fill="none" />
      <path d="M -3 -57 C -14 -46, -20 -38, -19 -33 C -15 -34, -8 -43, -3 -57 Z" stroke="#000000" stroke-width="2.5" fill="none" />
      <path d="M -4 -62 C -18 -69, -28 -65, -32 -61 C -27 -56, -17 -55, -4 -62 Z" stroke="#000000" stroke-width="2.5" fill="none" />

      <text x="0" y="20" font-family="'Cormorant Garamond', serif" font-size="52px" font-weight="700" letter-spacing="0.14em" fill="#000000" text-anchor="middle">NAVA</text>
      <line x1="-90" y1="36" x2="90" y2="36" stroke="#000000" stroke-width="1.5" />
      <circle cx="0" cy="36" r="3" fill="#000000" />
      <text x="0" y="60" font-family="'DM Sans', sans-serif" font-size="13px" font-weight="700" letter-spacing="0.4em" fill="#000000" text-anchor="middle">CREATIONS</text>
    </g>

    <g transform="translate(20, 255)">
      <text x="0" y="16" font-family="'DM Sans', sans-serif" font-size="11.5px" font-weight="700" fill="#15803D">✔ High contrast on standard thermal print</text>
      <text x="0" y="34" font-family="'DM Sans', sans-serif" font-size="11px" fill="#4B5563">• No greyscale dithering required</text>
      <text x="0" y="52" font-family="'DM Sans', sans-serif" font-size="11px" fill="#4B5563">• Thin hairlines hold above 200 DPI</text>
      <text x="0" y="74" font-family="'DM Sans', sans-serif" font-size="11px" font-weight="700" fill="#000000">Print Viability: 9.0 / 10</text>
    </g>
  </g>

  <!-- COLUMN 2: CONCEPT B MONOCHROME -->
  <g transform="translate(360, 95)">
    <rect width="280" height="380" rx="10" class="mono-card" />
    <text x="140" y="32" class="col-mono-hdr">CONCEPT B (MONOGRAM)</text>

    <rect x="20" y="55" width="240" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="2 2" />

    <g transform="translate(140, 145) scale(0.60)">
      <g transform="translate(-70, -80)">
        <path d="M 96 -8 A 38 38 0 1 0 96 48" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="96" cy="-8" r="4" fill="#000000" />
        <circle cx="96" cy="48" r="4" fill="#000000" />
        <path d="M 52 -12 L 52 52" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 53 -10 L 87 50" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="70" cy="20" r="5" fill="#FFFFFF" />
        <circle cx="70" cy="20" r="2.8" fill="#000000" />
        <path d="M 88 -12 L 88 52" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
      </g>

      <text x="0" y="20" font-family="'Tenor Sans', serif" font-size="52px" font-weight="600" letter-spacing="0.16em" fill="#000000" text-anchor="middle">NAVA</text>
      <line x1="-90" y1="36" x2="90" y2="36" stroke="#000000" stroke-width="1.5" />
      <rect x="-3" y="33" width="6" height="6" fill="#000000" transform="rotate(45 0 36)" />
      <text x="0" y="60" font-family="'Jost', sans-serif" font-size="13px" font-weight="700" letter-spacing="0.4em" fill="#000000" text-anchor="middle">CREATIONS</text>
    </g>

    <g transform="translate(20, 255)">
      <text x="0" y="16" font-family="'DM Sans', sans-serif" font-size="11.5px" font-weight="700" fill="#15803D">✔ Flawless solid black reproduction</text>
      <text x="0" y="34" font-family="'DM Sans', sans-serif" font-size="11px" fill="#4B5563">• Bold strokes survive low-cost thermal head</text>
      <text x="0" y="52" font-family="'DM Sans', sans-serif" font-size="11px" fill="#4B5563">• Can be laser-etched onto metallic bangles</text>
      <text x="0" y="74" font-family="'DM Sans', sans-serif" font-size="11px" font-weight="700" fill="#000000">Print Viability: 10 / 10</text>
    </g>
  </g>

  <!-- COLUMN 3: CONCEPT C MONOCHROME -->
  <g transform="translate(670, 95)">
    <rect width="280" height="380" rx="10" class="mono-card" />
    <text x="140" y="32" class="col-mono-hdr">CONCEPT C (ARTISAN HAND)</text>

    <rect x="20" y="55" width="240" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="2 2" />

    <g transform="translate(140, 145) scale(0.60)">
      <g transform="translate(-85, -74)">
        <path d="M 45 125 C 48 108, 54 98, 62 90 C 72 80, 84 76, 95 82" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" />
        <path d="M 62 90 C 65 72, 75 58, 88 50 C 96 45, 104 46, 108 52 C 104 58, 96 66, 92 78" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" />
        <circle cx="85" cy="74" r="28" stroke="#000000" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <circle cx="85" cy="46" r="3" fill="#000000" />
        <circle cx="105" cy="54" r="3" fill="#000000" />
        <circle cx="113" cy="74" r="3" fill="#000000" />
        <circle cx="105" cy="94" r="3" fill="#000000" />
      </g>

      <text x="0" y="20" font-family="'Cinzel', serif" font-size="52px" font-weight="700" letter-spacing="0.14em" fill="#000000" text-anchor="middle">NAVA</text>
      <path d="M -90 36 C -40 34, 40 37, 90 35" stroke="#000000" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <circle cx="0" cy="35.5" r="3" fill="#000000" />
      <text x="0" y="60" font-family="'Playfair Display', serif" font-style="italic" font-size="15px" letter-spacing="0.25em" fill="#000000" text-anchor="middle">CREATIONS</text>
    </g>

    <g transform="translate(20, 255)">
      <text x="0" y="16" font-family="'DM Sans', sans-serif" font-size="11.5px" font-weight="700" fill="#15803D">✔ Works well as a physical rubber stamp</text>
      <text x="0" y="34" font-family="'DM Sans', sans-serif" font-size="11px" fill="#4B5563">• Natural fit for water-based ink on kraft</text>
      <text x="0" y="52" font-family="'DM Sans', sans-serif" font-size="11px" fill="#B45309">▲ Kundan dots blur into outer line if over-inked</text>
      <text x="0" y="74" font-family="'DM Sans', sans-serif" font-size="11px" font-weight="700" fill="#000000">Print Viability: 8.2 / 10</text>
    </g>
  </g>
</svg>
