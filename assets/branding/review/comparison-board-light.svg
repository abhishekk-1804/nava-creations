<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .board-bg { fill: #FDFBF7; }
      .card-bg { fill: #FFFFFF; stroke: #E7E5E4; stroke-width: 1.5; }
      .title-main { font-family: 'DM Sans', -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1C1917; }
      .sub-main { font-family: 'DM Sans', sans-serif; font-size: 13px; fill: #57534E; }
      .concept-title { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700; fill: #1C1917; text-anchor: middle; }
      .concept-desc { font-family: 'DM Sans', sans-serif; font-size: 11.5px; fill: #78716C; text-anchor: middle; }
      .badge-rec { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #15803D; }
    </style>
  </defs>

  <rect width="1000" height="680" class="board-bg" />

  <!-- Board Header -->
  <g transform="translate(50, 45)">
    <text x="0" y="0" class="title-main">NAVA CREATIONS — Visual Comparison Board: Light Background</text>
    <text x="0" y="24" class="sub-main">Phase 1.5 Independent Audit • Side-by-Side Evaluation of Authorized Master Lockups on Ivory (#FDFBF7)</text>
  </g>

  <!-- COLUMN 1: CONCEPT A (x=50, y=95) -->
  <g transform="translate(50, 95)">
    <rect width="280" height="520" rx="12" class="card-bg" />
    <!-- Header Tag -->
    <rect x="20" y="20" width="120" height="22" rx="4" fill="#DCFCE7" />
    <text x="28" y="35" class="badge-rec">RECOMMENDED</text>
    <text x="140" y="70" class="concept-title">CONCEPT A</text>
    <text x="140" y="88" class="concept-desc">Botanical Parijata Line-Art</text>

    <!-- Logo Display Box -->
    <rect x="15" y="110" width="250" height="230" rx="8" fill="#FDFBF7" stroke="#E7E5E4" />
    <!-- Embedded Scaled Concept A Stacked Logo -->
    <g transform="translate(140, 205) scale(0.65)">
      <!-- Parijata Flower -->
      <circle cx="0" cy="-60" r="4.5" fill="#5C1D38" stroke="#C5A059" stroke-width="1.8" />
      <path d="M 0 -64.5 C -7 -78, -3 -88, 0 -94 C 3 -88, 7 -78, 0 -64.5 Z" fill="none" stroke="#C5A059" stroke-width="2.2" />
      <path d="M 4 -62 C 18 -69, 28 -65, 32 -61 C 27 -56, 17 -55, 4 -62 Z" fill="none" stroke="#C5A059" stroke-width="2.2" />
      <path d="M 3 -57 C 14 -46, 20 -38, 19 -33 C 15 -34, 8 -43, 3 -57 Z" fill="none" stroke="#C5A059" stroke-width="2.2" />
      <path d="M -3 -57 C -14 -46, -20 -38, -19 -33 C -15 -34, -8 -43, -3 -57 Z" fill="none" stroke="#C5A059" stroke-width="2.2" />
      <path d="M -4 -62 C -18 -69, -28 -65, -32 -61 C -27 -56, -17 -55, -4 -62 Z" fill="none" stroke="#C5A059" stroke-width="2.2" />
      <circle cx="0" cy="-80" r="1.8" fill="#C5A059" />
      <!-- Bangle Ring Atmosphere -->
      <circle cx="0" cy="-60" r="50" fill="none" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />

      <!-- Wordmark -->
      <text x="0" y="20" font-family="'Cormorant Garamond', serif" font-size="52px" font-weight="600" letter-spacing="0.14em" fill="#5C1D38" text-anchor="middle">NAVA</text>
      <line x1="-90" y1="36" x2="90" y2="36" stroke="#C5A059" stroke-width="1.2" />
      <circle cx="0" cy="36" r="2.8" fill="#5C1D38" />
      <text x="0" y="60" font-family="'DM Sans', sans-serif" font-size="13px" font-weight="600" letter-spacing="0.4em" fill="#C5A059" text-anchor="middle">CREATIONS</text>
      <text x="0" y="80" font-family="'DM Sans', sans-serif" font-size="9px" font-weight="600" letter-spacing="0.25em" fill="#57534E" text-anchor="middle">BENGALURU</text>
    </g>

    <!-- Audit Evaluation Notes -->
    <g transform="translate(20, 360)">
      <text x="0" y="0" font-family="'DM Sans', sans-serif" font-size="12px" font-weight="700" fill="#1C1917">Independent Audit Critique:</text>
      <text x="0" y="20" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#15803D">✔ Strongest South Indian bridal resonance</text>
      <text x="0" y="38" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#15803D">✔ High perceived luxury on cream surfaces</text>
      <text x="0" y="56" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#B45309">▲ Petal hairlines fragile below 24px</text>
      <text x="0" y="74" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#B91C1C">✖ Font dependency if text not converted to paths</text>
      <text x="0" y="100" font-family="'DM Sans', sans-serif" font-size="11px" font-weight="600" fill="#78716C">Overall Score: 8.8 / 10</text>
    </g>
  </g>

  <!-- COLUMN 2: CONCEPT B (x=360, y=95) -->
  <g transform="translate(360, 95)">
    <rect width="280" height="520" rx="12" class="card-bg" />
    <rect x="20" y="20" width="105" height="22" rx="4" fill="#FEF3C7" />
    <text x="28" y="35" font-family="'DM Sans', sans-serif" font-size="10px" font-weight="700" fill="#92400E">CONTEMPORARY</text>
    <text x="140" y="70" class="concept-title">CONCEPT B</text>
    <text x="140" y="88" class="concept-desc">Architectural NC Monogram</text>

    <!-- Logo Display Box -->
    <rect x="15" y="110" width="250" height="230" rx="8" fill="#F8F8F6" stroke="#E7E5E4" />
    <g transform="translate(140, 205) scale(0.65)">
      <!-- Monogram NC -->
      <g transform="translate(-70, -80)">
        <circle cx="70" cy="20" r="50" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.4" />
        <path d="M 96 -8 A 38 38 0 1 0 96 48" fill="none" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" />
        <circle cx="96" cy="-8" r="3" fill="#D4AF37" />
        <circle cx="96" cy="48" r="3" fill="#D4AF37" />

        <path d="M 52 -12 L 52 52" stroke="#173E2E" stroke-width="3.5" stroke-linecap="round" />
        <path d="M 53 -10 L 87 50" stroke="#173E2E" stroke-width="3.5" stroke-linecap="round" />
        <circle cx="70" cy="20" r="3.5" fill="#FFFFFF" />
        <circle cx="70" cy="20" r="2" fill="#D4AF37" />
        <path d="M 88 -12 L 88 52" stroke="#173E2E" stroke-width="3.5" stroke-linecap="round" />
      </g>

      <!-- Wordmark -->
      <text x="0" y="20" font-family="'Tenor Sans', 'Playfair Display', serif" font-size="52px" font-weight="500" letter-spacing="0.16em" fill="#173E2E" text-anchor="middle">NAVA</text>
      <line x1="-90" y1="36" x2="90" y2="36" stroke="#D4AF37" stroke-width="1.2" />
      <rect x="-2.5" y="33.5" width="5" height="5" fill="#173E2E" transform="rotate(45 0 36)" />
      <text x="0" y="60" font-family="'Jost', sans-serif" font-size="13px" font-weight="600" letter-spacing="0.4em" fill="#D4AF37" text-anchor="middle">CREATIONS</text>
      <text x="0" y="80" font-family="'Jost', sans-serif" font-size="9px" font-weight="600" letter-spacing="0.25em" fill="#57534E" text-anchor="middle">BENGALURU</text>
    </g>

    <!-- Audit Evaluation Notes -->
    <g transform="translate(20, 360)">
      <text x="0" y="0" font-family="'DM Sans', sans-serif" font-size="12px" font-weight="700" fill="#1C1917">Independent Audit Critique:</text>
      <text x="0" y="20" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#15803D">✔ Flawless geometric scalability down to 16px</text>
      <text x="0" y="38" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#15803D">✔ High international / cosmopolitan appeal</text>
      <text x="0" y="56" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#B45309">▲ Lower immediate Indian ethnic recognition</text>
      <text x="0" y="74" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#B45309">▲ Bangle metaphor in 'C' is hidden / subtle</text>
      <text x="0" y="100" font-family="'DM Sans', sans-serif" font-size="11px" font-weight="600" fill="#78716C">Overall Score: 8.5 / 10</text>
    </g>
  </g>

  <!-- COLUMN 3: CONCEPT C (x=670, y=95) -->
  <g transform="translate(670, 95)">
    <rect width="280" height="520" rx="12" class="card-bg" />
    <rect x="20" y="20" width="85" height="22" rx="4" fill="#FEE2E2" />
    <text x="28" y="35" font-family="'DM Sans', sans-serif" font-size="10px" font-weight="700" fill="#991B1B">ARTISAN</text>
    <text x="140" y="70" class="concept-title">CONCEPT C</text>
    <text x="140" y="88" class="concept-desc">Maker's Hand &amp; Bangle</text>

    <!-- Logo Display Box -->
    <rect x="15" y="110" width="250" height="230" rx="8" fill="#F4EFEB" stroke="#E7E5E4" />
    <g transform="translate(140, 205) scale(0.65)">
      <!-- Hand & Bangle Mark -->
      <g transform="translate(-85, -74)">
        <path d="M 45 125 C 48 108, 54 98, 62 90 C 72 80, 84 76, 95 82" stroke="#9E4733" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <path d="M 62 90 C 65 72, 75 58, 88 50 C 96 45, 104 46, 108 52 C 104 58, 96 66, 92 78" stroke="#9E4733" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <circle cx="85" cy="74" r="28" stroke="#D89D40" stroke-width="3" fill="none" stroke-linecap="round" />
        <circle cx="85" cy="46" r="2.5" fill="#D89D40" />
        <circle cx="105" cy="54" r="2.5" fill="#D89D40" />
        <circle cx="113" cy="74" r="2.5" fill="#D89D40" />
        <circle cx="105" cy="94" r="2.5" fill="#D89D40" />
      </g>

      <!-- Wordmark -->
      <text x="0" y="20" font-family="'Cinzel', 'Playfair Display', serif" font-size="52px" font-weight="600" letter-spacing="0.14em" fill="#2E1B15" text-anchor="middle">NAVA</text>
      <path d="M -90 36 C -40 34, 40 37, 90 35" stroke="#D89D40" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <circle cx="0" cy="35.5" r="2.8" fill="#9E4733" />
      <text x="0" y="60" font-family="'Playfair Display', serif" font-style="italic" font-size="15px" letter-spacing="0.25em" fill="#9E4733" text-anchor="middle">CREATIONS</text>
      <text x="0" y="80" font-family="'DM Sans', sans-serif" font-size="9px" font-weight="600" letter-spacing="0.25em" fill="#57534E" text-anchor="middle">HANDCRAFTED BENGALURU</text>
    </g>

    <!-- Audit Evaluation Notes -->
    <g transform="translate(20, 360)">
      <text x="0" y="0" font-family="'DM Sans', sans-serif" font-size="12px" font-weight="700" fill="#1C1917">Independent Audit Critique:</text>
      <text x="0" y="20" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#15803D">✔ High emotional warmth &amp; craft sincerity</text>
      <text x="0" y="38" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#B45309">▲ Hand illustration loses detail below 32px</text>
      <text x="0" y="56" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#B45309">▲ Category restriction: hand + bangle mark</text>
      <text x="0" y="74" font-family="'DM Sans', sans-serif" font-size="11.5px" fill="#B91C1C">✖ Risks looking like NGO / rustic craft bazaar</text>
      <text x="0" y="100" font-family="'DM Sans', sans-serif" font-size="11px" font-weight="600" fill="#78716C">Overall Score: 7.2 / 10</text>
    </g>
  </g>
</svg>
