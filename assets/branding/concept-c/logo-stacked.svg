<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <defs>
    <style>
      .serif-title-c { font-family: 'Cinzel', 'Playfair Display', serif; font-size: 54px; font-weight: 600; letter-spacing: 0.16em; fill: #2E1B15; text-anchor: middle; }
      .serif-italic-c { font-family: 'Playfair Display', serif; font-style: italic; font-size: 16px; letter-spacing: 0.32em; fill: #9E4733; text-anchor: middle; }
      .craft-stroke { stroke: #9E4733; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .gold-bangle-stroke { stroke: #D89D40; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- Centered Artisan Hand Mark (Center x=200, y=95) -->
  <g transform="translate(115, 15)">
    <!-- Wrist & Palm Base -->
    <path class="craft-stroke" d="M 45 125 C 48 108, 54 98, 62 90 C 72 80, 84 76, 95 82" />
    <path class="craft-stroke" d="M 62 90 C 65 72, 75 58, 88 50 C 96 45, 104 46, 108 52 C 104 58, 96 66, 92 78" />
    <path class="craft-stroke" d="M 72 65 C 78 52, 88 40, 96 35 C 101 32, 106 34, 108 38 C 103 48, 92 60, 86 72" />
    <path class="craft-stroke" d="M 50 100 C 44 92, 42 82, 45 74 C 48 68, 54 68, 58 75 C 60 80, 62 86, 62 90" />

    <!-- Centered Bangle with Kundan Seeds -->
    <circle cx="85" cy="74" r="32" class="gold-bangle-stroke" />
    <circle cx="85" cy="42" r="2.8" fill="#D89D40" />
    <circle cx="108" cy="51" r="2.8" fill="#D89D40" />
    <circle cx="117" cy="74" r="2.8" fill="#D89D40" />
    <circle cx="108" cy="97" r="2.8" fill="#D89D40" />
    <circle cx="85" cy="106" r="2.8" fill="#D89D40" />
    <circle cx="62" cy="97" r="2.8" fill="#D89D40" />
    <circle cx="53" cy="74" r="2.8" fill="#D89D40" />
    <circle cx="62" cy="51" r="2.8" fill="#D89D40" />
  </g>

  <!-- Typography Stacked -->
  <text x="200" y="235" class="serif-title-c">NAVA</text>

  <path d="M 80 256 C 140 254, 260 257, 320 255" stroke="#D89D40" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="200" cy="255.5" r="3" fill="#9E4733" />

  <text x="204" y="286" class="serif-italic-c">CREATIONS</text>
  <text x="200" y="316" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.25em" fill="#2E1B15" text-anchor="middle">BENGALURU • ARTISAN ACCESSORIES</text>
</svg>
