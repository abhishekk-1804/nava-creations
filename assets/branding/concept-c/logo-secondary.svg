    <path class="craft-stroke" d="M 50 100 C 44 92, 42 82, 45 74 C 48 68, 54 68, 58 75 C 60 80, 62 86, 62 90" />

    <circle cx="85" cy="74" r="32" class="gold-bangle-stroke" />
    <circle cx="85" cy="42" r="2.8" fill="#D89D40" />
    <circle cx="108" cy="51" r="2.8" fill="#D89D40" />
    <circle cx="117" cy="74" r="2.8" fill="#D89D40" />
    <circle cx="108" cy="97" r="2.8" fill="#D89D40" />
    <circle cx="85" cy="106" r="2.8" fill="#D89D40" />
    <circle cx="62" cy="97" r="2.8" fill="#D89D40" />
