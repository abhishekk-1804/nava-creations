<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <path id="textArcTopC" d="M 45 150 A 105 105 0 0 1 255 150" fill="none" />
    <path id="textArcBottomC" d="M 255 150 A 105 105 0 0 1 45 150" fill="none" />
    <style>
      .seal-title-c { font-family: 'Cinzel', 'Playfair Display', serif; font-size: 18px; font-weight: 600; letter-spacing: 0.24em; fill: #2E1B15; }
      .seal-sub-c { font-family: 'Playfair Display', serif; font-style: italic; font-size: 13px; letter-spacing: 0.28em; fill: #9E4733; }
      .craft-stroke { stroke: #9E4733; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .gold-bangle-stroke { stroke: #D89D40; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- Circular Kraft/Clay Style Outer Stamp Rings -->
  <circle cx="150" cy="150" r="142" fill="#F4EFEB" stroke="#9E4733" stroke-width="2.5" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#D89D40" stroke-width="1.2" stroke-dasharray="3 3" />
  <circle cx="150" cy="150" r="82" fill="none" stroke="#D89D40" stroke-width="1.2" />

  <!-- Circular Text Along Path -->
  <text class="seal-title-c">
    <textPath href="#textArcTopC" startOffset="50%" text-anchor="middle">NAVA CREATIONS</textPath>
  </text>
  <text class="seal-sub-c">
    <textPath href="#textArcBottomC" startOffset="50%" text-anchor="middle">★ Handcrafted in Bengaluru ★</textPath>
  </text>

