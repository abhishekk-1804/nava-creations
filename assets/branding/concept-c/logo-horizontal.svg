<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <style>
      .terracotta-fill { fill: #9E4733; }
      .amber-gold { fill: #D89D40; stroke: #D89D40; }
      .craft-stroke { stroke: #9E4733; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .gold-bangle-stroke { stroke: #D89D40; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .serif-title-c { font-family: 'Cinzel', 'Playfair Display', 'Cormorant Garamond', serif; font-size: 52px; font-weight: 600; letter-spacing: 0.14em; fill: #2E1B15; }
      .serif-italic-c { font-family: 'Playfair Display', 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; letter-spacing: 0.28em; fill: #9E4733; }
    </style>
  </defs>

  <!-- Left Icon: Stylized Artisan Hand Cupping a Pure Golden Bangle (Center x=85, y=80) -->
  <g transform="translate(15, 0)">
    <!-- Organic Hand Silhouette Lines (Continuous Gentle Curve) -->
    <!-- Wrist & Palm Base -->
    <path class="craft-stroke" d="M 45 125 C 48 108, 54 98, 62 90 C 72 80, 84 76, 95 82" />
    <!-- Cupped Fingers Outline Holding Bangle -->
    <path class="craft-stroke" d="M 62 90 C 65 72, 75 58, 88 50 C 96 45, 104 46, 108 52 C 104 58, 96 66, 92 78" />
    <path class="craft-stroke" d="M 72 65 C 78 52, 88 40, 96 35 C 101 32, 106 34, 108 38 C 103 48, 92 60, 86 72" />
    <!-- Thumb Contour -->
    <path class="craft-stroke" d="M 50 100 C 44 92, 42 82, 45 74 C 48 68, 54 68, 58 75 C 60 80, 62 86, 62 90" />

    <!-- The Centered Handcrafted Bangle (Amber Gold Ring Floating in Palm) -->
    <circle cx="85" cy="74" r="32" class="gold-bangle-stroke" />
    <!-- 8 Kundan Stone Settings Around Bangle Perimeter -->
    <circle cx="85" cy="42" r="2.8" fill="#D89D40" />
    <circle cx="108" cy="51" r="2.8" fill="#D89D40" />
    <circle cx="117" cy="74" r="2.8" fill="#D89D40" />
    <circle cx="108" cy="97" r="2.8" fill="#D89D40" />
    <circle cx="85" cy="106" r="2.8" fill="#D89D40" />
    <circle cx="62" cy="97" r="2.8" fill="#D89D40" />
    <circle cx="53" cy="74" r="2.8" fill="#D89D40" />
    <circle cx="62" cy="51" r="2.8" fill="#D89D40" />
  </g>

  <!-- Vertical Hairline Divider -->
  <line x1="165" y1="36" x2="165" y2="124" stroke="#E7E5E4" stroke-width="1.2" />

  <!-- Horizontal Wordmark Lockup -->
  <g transform="translate(195, 0)">
    <text x="0" y="82" class="serif-title-c">NAVA</text>

    <!-- Warm Organic Brush Stroke / Line -->
    <path d="M 2 96 C 60 94, 180 97, 310 95" stroke="#D89D40" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="155" cy="95.5" r="3" fill="#9E4733" />

    <text x="4" y="120" class="serif-italic-c">CREATIONS</text>
    <text x="200" y="120" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.22em" fill="#2E1B15">• HANDCRAFTED</text>
  </g>
</svg>
