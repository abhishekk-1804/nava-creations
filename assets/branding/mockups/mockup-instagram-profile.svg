<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <style>
      .ig-bg { fill: #FFFFFF; }
      .ig-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1C1917; }
      .ig-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #262626; line-height: 1.45; }
      .ig-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #8E8E8E; }
      .ig-btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .story-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #262626; text-anchor: middle; }
    </style>
  </defs>

  <rect width="600" height="700" class="ig-bg" />

  <!-- Instagram Header Nav -->
  <g transform="translate(24, 25)">
    <text x="0" y="16" class="ig-bold" font-size="18px">nava__creationsss</text>
    <circle cx="170" cy="11" r="6" fill="#0095F6" />
    <path d="M 168 11 L 170 13 L 173 9" stroke="#FFFFFF" stroke-width="1.2" fill="none" />
  </g>

  <!-- Profile Info Row -->
  <g transform="translate(24, 65)">
    <!-- Avatar with Gradient Story Ring -->
    <circle cx="45" cy="45" r="44" fill="none" stroke="#C5A059" stroke-width="2.5" />
    <!-- Avatar Fill: Concept A Parijata Crest on Deep Plum -->
    <circle cx="45" cy="45" r="39" fill="#5C1D38" />
    <!-- Mini Flower Graphic -->
    <g transform="translate(45, 45) scale(0.6)">
      <circle cx="0" cy="0" r="3" fill="#C5A059" />
      <path d="M 0 -3 C -3 -12, 0 -18, 0 -22 C 0 -18, 3 -12, 0 -3 Z" fill="#FDFBF7" />
      <path d="M 3 -1 C 12 -4, 18 0, 22 0 C 18 2, 12 4, 3 -1 Z" fill="#FDFBF7" />
      <path d="M 2 2 C 10 10, 14 16, 14 19 C 11 18, 5 12, 2 2 Z" fill="#FDFBF7" />
      <path d="M -2 2 C -10 10, -14 16, -14 19 C -11 18, -5 12, -2 2 Z" fill="#FDFBF7" />
      <path d="M -3 -1 C -12 -4, -18 0, -22 0 C -18 2, -12 4, -3 -1 Z" fill="#FDFBF7" />
    </g>

    <!-- Stats Column -->
    <g transform="translate(140, 32)">
      <text x="40" y="0" class="ig-bold" text-anchor="middle">142</text>
      <text x="40" y="18" class="ig-sub" text-anchor="middle">posts</text>

      <text x="140" y="0" class="ig-bold" text-anchor="middle">18.4K</text>
      <text x="140" y="18" class="ig-sub" text-anchor="middle">followers</text>

      <text x="240" y="0" class="ig-bold" text-anchor="middle">389</text>
      <text x="240" y="18" class="ig-sub" text-anchor="middle">following</text>
    </g>
  </g>

  <!-- Bio Section -->
  <g transform="translate(24, 175)">
    <text x="0" y="14" class="ig-bold">NAVA CREATIONS | Handcrafted Jewellery</text>
    <text x="0" y="32" class="ig-sub">Jewellery &amp; Accessories • Bengaluru, India</text>
    <text x="0" y="52" class="ig-text">✨ Handcrafted Bangles • Bridal Chuda • Kundan Adornments</text>
    <text x="0" y="70" class="ig-text">🌸 Millimeter-perfect bridal sizing &amp; color customization</text>
    <text x="0" y="88" class="ig-text">📦 Shipping Pan-India | Worldwide Bridal Orders</text>
    <text x="0" y="108" class="ig-text" font-weight="600" fill="#00376B">🔗 shop.navacreations.in</text>
  </g>

  <!-- Action Buttons Row -->
  <g transform="translate(24, 305)">
    <rect x="0" y="0" width="260" height="34" rx="8" fill="#5C1D38" />
    <text x="130" y="22" class="ig-btn-text" text-anchor="middle">Visit Storefront</text>

    <rect x="272" y="0" width="220" height="34" rx="8" fill="#EFEFEF" />
    <text x="382" y="22" font-family="-apple-system, sans-serif" font-size="13px" font-weight="600" fill="#262626" text-anchor="middle">WhatsApp Bridal Styling</text>

    <rect x="504" y="0" width="48" height="34" rx="8" fill="#EFEFEF" />
    <text x="528" y="22" font-size="15px" fill="#262626" text-anchor="middle">👤+</text>
  </g>

  <!-- Story Highlights (5 Circles) -->
  <g transform="translate(24, 360)">
    <!-- Highlight 1: Bridal -->
    <circle cx="40" cy="40" r="34" fill="#FAF6F0" stroke="#E7E5E4" stroke-width="1.5" />
    <text x="40" y="44" font-size="18px" text-anchor="middle">👰</text>
    <text x="40" y="92" class="story-title">Bridal</text>

    <!-- Highlight 2: Sizing -->
    <circle cx="145" cy="40" r="34" fill="#FAF6F0" stroke="#E7E5E4" stroke-width="1.5" />
    <text x="145" y="44" font-size="18px" text-anchor="middle">📏</text>
    <text x="145" y="92" class="story-title">Size Guide</text>

    <!-- Highlight 3: Kundan -->
    <circle cx="250" cy="40" r="34" fill="#FAF6F0" stroke="#E7E5E4" stroke-width="1.5" />
    <text x="250" y="44" font-size="18px" text-anchor="middle">💎</text>
    <text x="250" y="92" class="story-title">Kundan</text>

    <!-- Highlight 4: Reviews -->
    <circle cx="355" cy="40" r="34" fill="#FAF6F0" stroke="#E7E5E4" stroke-width="1.5" />
    <text x="355" y="44" font-size="18px" text-anchor="middle">💌</text>
    <text x="355" y="92" class="story-title">Love</text>

    <!-- Highlight 5: Atelier -->
    <circle cx="460" cy="40" r="34" fill="#FAF6F0" stroke="#E7E5E4" stroke-width="1.5" />
    <text x="460" y="44" font-size="18px" text-anchor="middle">✨</text>
    <text x="460" y="92" class="story-title">Atelier</text>
  </g>

  <!-- Grid Separator & Tabs -->
  <line x1="0" y1="475" x2="600" y2="475" stroke="#DBDBDB" stroke-width="1" />
  <g transform="translate(0, 475)">
    <line x1="50" y1="0" x2="150" y2="0" stroke="#1C1917" stroke-width="1.8" />
    <text x="100" y="24" font-size="14px" fill="#1C1917" text-anchor="middle">▦ POSTS</text>
    <text x="300" y="24" font-size="14px" fill="#8E8E8E" text-anchor="middle">▷ REELS</text>
    <text x="500" y="24" font-size="14px" fill="#8E8E8E" text-anchor="middle">🏷 TAGGED</text>
  </g>

  <!-- 3 Grid Photo Placeholders (190 x 190) -->
  <g transform="translate(12, 510)">
    <rect x="0" y="0" width="186" height="180" fill="#FAF6F0" stroke="#E7E5E4" />
    <ellipse cx="93" cy="90" rx="55" ry="18" fill="none" stroke="#D4AF37" stroke-width="8" />
    <ellipse cx="93" cy="90" rx="55" ry="18" fill="none" stroke="#5C1D38" stroke-width="3" />

    <rect x="195" y="0" width="186" height="180" fill="#FAF6F0" stroke="#E7E5E4" />
    <ellipse cx="288" cy="90" rx="55" ry="18" fill="none" stroke="#8B263E" stroke-width="6" />

    <rect x="390" y="0" width="186" height="180" fill="#FAF6F0" stroke="#E7E5E4" />
    <ellipse cx="483" cy="90" rx="55" ry="18" fill="none" stroke="#173E2E" stroke-width="6" />
  </g>
</svg>
