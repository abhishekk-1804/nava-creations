<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .bg-hero { fill: #FDFBF7; }
      .hero-plum { fill: #5C1D38; }
      .hero-gold { fill: #C5A059; stroke: #C5A059; }
      .hero-title { font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif; font-size: 58px; font-weight: 500; line-height: 1.15; fill: #1C1917; }
      .hero-sub { font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 400; line-height: 1.6; fill: #57534E; }
      .hero-btn { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; fill: #FDFBF7; }
      .hero-badge { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; fill: #5C1D38; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" class="bg-hero" />

  <!-- Subtle Ornamental Background Aura -->
  <circle cx="950" cy="340" r="280" fill="#F4EFEB" opacity="0.7" />
  <circle cx="950" cy="340" r="220" fill="none" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.4" />

  <!-- Left Editorial Content Column (x=100) -->
  <g transform="translate(100, 140)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#F4EFEB" stroke="#E7E5E4" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#C5A059" />
    <text x="26" y="18" class="hero-badge">FESTIVE &amp; BRIDAL 2026</text>

    <!-- Main Headline -->
    <text x="0" y="85" class="hero-title">Handcrafted for the<tspan x="0" y="150" fill="#5C1D38">moments that stay.</tspan></text>

    <!-- Subtitle Copy -->
    <text x="0" y="215" class="hero-sub">Rooted in Bengaluru's artisanal jewellery heritage. Kundan-work bangles,</text>
    <text x="0" y="245" class="hero-sub">bridal chuda sets, and bespoke adornments crafted for modern celebrations.</text>

    <!-- Call to Action Buttons -->
    <g transform="translate(0, 300)">
      <!-- Primary Filled Button -->
      <rect x="0" y="0" width="200" height="52" rx="8" fill="#5C1D38" />
      <text x="100" y="32" class="hero-btn" text-anchor="middle">EXPLORE BRIDAL</text>

      <!-- Secondary Outlined Button -->
      <rect x="220" y="0" width="180" height="52" rx="8" fill="none" stroke="#5C1D38" stroke-width="1.5" />
      <text x="310" y="32" font-family="'DM Sans', sans-serif" font-size="14px" font-weight="600" letter-spacing="0.08em" fill="#5C1D38" text-anchor="middle">VIEW CATALOGUE</text>
    </g>

    <!-- Trust Badges Row -->
    <g transform="translate(0, 400)">
      <circle cx="10" cy="10" r="10" fill="#EAE5DF" />
      <text x="8" y="14" font-size="11" fill="#5C1D38">✓</text>
      <text x="28" y="14" font-family="'DM Sans', sans-serif" font-size="13px" font-weight="500" fill="#57534E">Millimeter-Accurate Sizing (2.2 – 2.10)</text>

      <circle cx="270" cy="10" r="10" fill="#EAE5DF" />
      <text x="268" y="14" font-size="11" fill="#5C1D38">✓</text>
      <text x="288" y="14" font-family="'DM Sans', sans-serif" font-size="13px" font-weight="500" fill="#57534E">Handcrafted in Bengaluru</text>
    </g>
  </g>

  <!-- Right Visual Showcase / Mockup Feature Frame (x=700) -->
  <g transform="translate(700, 100)">
    <!-- Elegant Beveled Frame -->
    <rect x="0" y="0" width="400" height="480" rx="16" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5" filter="drop-shadow(0 12px 32px rgba(28,25,23,0.08))" />

    <!-- Image Placeholder Background with Silk Texture Graphic -->
    <rect x="16" y="16" width="368" height="360" rx="12" fill="#FAF6F0" />

    <!-- Visual Representation of Bridal Chuda Stacking Set -->
    <g transform="translate(200, 196)">
      <!-- Outer Velvet Cushion Shadow -->
      <ellipse cx="0" cy="65" rx="110" ry="22" fill="#E7E5E4" opacity="0.6" />

      <!-- Bangle Stack Representation -->
      <!-- Bangle 1 (Kundan Broad Kada) -->
      <ellipse cx="0" cy="-20" rx="90" ry="24" fill="none" stroke="#D4AF37" stroke-width="12" />
      <ellipse cx="0" cy="-20" rx="90" ry="24" fill="none" stroke="#5C1D38" stroke-width="4" />
      <circle cx="-60" cy="-20" r="3" fill="#FFFFFF" />
      <circle cx="0" cy="-4" r="3" fill="#FFFFFF" />
      <circle cx="60" cy="-20" r="3" fill="#FFFFFF" />

      <!-- Bangle 2 (Silk Thread Ruby Red) -->
      <ellipse cx="0" cy="0" rx="88" ry="23" fill="none" stroke="#8B263E" stroke-width="7" />
      <!-- Bangle 3 (Gold Filigree) -->
      <ellipse cx="0" cy="14" rx="87" ry="22" fill="none" stroke="#C5A059" stroke-width="5" stroke-dasharray="2 3" />
      <!-- Bangle 4 (Silk Thread Emerald Green) -->
      <ellipse cx="0" cy="26" rx="86" ry="22" fill="none" stroke="#173E2E" stroke-width="7" />
      <!-- Bangle 5 (Kundan Broad Kada Bottom) -->
      <ellipse cx="0" cy="46" rx="90" ry="24" fill="none" stroke="#D4AF37" stroke-width="12" />
      <ellipse cx="0" cy="46" rx="90" ry="24" fill="none" stroke="#5C1D38" stroke-width="4" />
      <circle cx="-60" cy="46" r="3" fill="#FFFFFF" />
      <circle cx="0" cy="62" r="3" fill="#FFFFFF" />
      <circle cx="60" cy="46" r="3" fill="#FFFFFF" />
    </g>

    <!-- Product Tag Beneath Image -->
    <g transform="translate(24, 400)">
      <text x="0" y="16" font-family="'Cormorant Garamond', serif" font-size="20px" font-weight="600" fill="#1C1917">The Meenakari Peacock Bridal Chuda</text>
      <text x="0" y="38" font-family="'DM Sans', sans-serif" font-size="12px" fill="#57534E">Set of 16 Bangles • Custom Silk Threading</text>
      <text x="350" y="24" font-family="'DM Mono', monospace" font-size="18px" font-weight="500" fill="#5C1D38" text-anchor="end">₹2,899</text>
    </g>
  </g>
</svg>
