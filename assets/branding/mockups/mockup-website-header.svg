<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%">
  <defs>
    <style>
      .top-bar { fill: #5C1D38; }
      .nav-bg { fill: #FFFFFF; }
      .bar-text { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 500; letter-spacing: 0.14em; fill: #FDFBF7; text-anchor: middle; }
      .nav-link { font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 500; letter-spacing: 0.08em; fill: #1C1917; }
      .nav-link:hover { fill: #5C1D38; }
      .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; letter-spacing: 0.18em; fill: #5C1D38; }
      .brand-sub { font-family: 'DM Sans', sans-serif; font-size: 8px; font-weight: 600; letter-spacing: 0.35em; fill: #C5A059; }
      .icon-stroke { stroke: #1C1917; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- Top Announcement Bar (Height 36px) -->
  <rect x="0" y="0" width="1200" height="36" class="top-bar" />
  <text x="600" y="23" class="bar-text">✨ CELEBRATE THE BRIDAL SEASON: COMPLIMENTARY BENGALURU DELIVERY ON ORDERS ABOVE ₹1,999 ✨</text>

  <!-- Main Sticky Header Bar (Height 84px) -->
  <rect x="0" y="36" width="1200" height="84" class="nav-bg" stroke="#E7E5E4" stroke-width="1" />

  <!-- Left Navigation Links -->
  <g transform="translate(60, 84)">
    <text x="0" y="0" class="nav-link">SHOP ALL</text>
    <text x="95" y="0" class="nav-link">HANDMADE BANGLES</text>
    <text x="260" y="0" class="nav-link" font-weight="600" fill="#5C1D38">BRIDAL CHUDA</text>
    <text x="385" y="0" class="nav-link">KUNDAN WORK</text>
  </g>

  <!-- Center Brand Logo Lockup (x=600) -->
  <g transform="translate(600, 68)">
    <circle cx="0" cy="-14" r="10" fill="none" stroke="#C5A059" stroke-width="1" />
    <circle cx="0" cy="-14" r="2.5" fill="#5C1D38" />
    <text x="0" y="14" class="brand-title" text-anchor="middle">NAVA</text>
    <text x="0" y="27" class="brand-sub" text-anchor="middle">CREATIONS</text>
  </g>

  <!-- Right Navigation Links & Utility Icons -->
  <g transform="translate(820, 84)">
    <text x="0" y="0" class="nav-link">CUSTOM ORDERS</text>
    <text x="140" y="0" class="nav-link">SIZE GUIDE</text>
  </g>

  <!-- Utility Icons: Search, Account, Wishlist, Cart -->
  <g transform="translate(1040, 78)">
    <!-- Search Icon -->
    <circle cx="10" cy="0" r="6" class="icon-stroke" />
    <line x1="14.5" y1="4.5" x2="20" y2="10" class="icon-stroke" />

    <!-- User Account Icon -->
    <circle cx="45" cy="-3" r="4.5" class="icon-stroke" />
    <path d="M 37 8 C 37 4, 53 4, 53 8" class="icon-stroke" />

    <!-- Wishlist Heart -->
    <path d="M 75 -2 C 73 -6, 68 -6, 66 -2 C 64 2, 70 6, 75 9 C 80 6, 86 2, 84 -2 C 82 -6, 77 -6, 75 -2 Z" class="icon-stroke" />

    <!-- Cart Bag with Badge -->
    <path d="M 102 7 L 116 7 L 118 -3 L 100 -3 Z" class="icon-stroke" />
    <path d="M 105 -3 C 105 -7, 113 -7, 113 -3" class="icon-stroke" />
    <circle cx="118" cy="-5" r="7" fill="#5C1D38" />
    <text x="118" y="-2" font-family="'DM Sans', sans-serif" font-size="9px" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>

  <!-- Subtle Bottom Shadow / Divider -->
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#E7E5E4" stroke-width="1" />
</svg>
