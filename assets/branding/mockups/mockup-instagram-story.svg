<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <style>
      .story-bg { fill: #FDFBF7; }
      .story-brand { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; letter-spacing: 0.22em; fill: #5C1D38; }
      .story-title { font-family: 'Cormorant Garamond', serif; font-size: 64px; font-weight: 500; line-height: 1.15; fill: #1C1917; text-anchor: middle; }
      .story-sub { font-family: 'DM Sans', sans-serif; font-size: 24px; font-weight: 400; line-height: 1.5; fill: #57534E; text-anchor: middle; }
      .sticker-text { font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700; fill: #00376B; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1080" height="1920" class="story-bg" />

  <!-- Top Progress Bar (Simulating IG Story Viewer UI) -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="310" height="4" rx="2" fill="#5C1D38" />
    <rect x="340" y="0" width="310" height="4" rx="2" fill="#E7E5E4" />
    <rect x="680" y="0" width="310" height="4" rx="2" fill="#E7E5E4" />
  </g>

  <!-- Story Header (Avatar & Account) -->
  <g transform="translate(50, 70)">
    <circle cx="28" cy="28" r="28" fill="#5C1D38" />
    <circle cx="28" cy="28" r="24" fill="none" stroke="#C5A059" stroke-width="1.2" />
    <circle cx="28" cy="28" r="4" fill="#C5A059" />
    <text x="75" y="36" font-family="-apple-system, sans-serif" font-size="22px" font-weight="700" fill="#1C1917">nava__creationsss</text>
    <text x="280" y="36" font-family="-apple-system, sans-serif" font-size="20px" fill="#78716C">3h</text>
  </g>

  <!-- Editorial Top Stamp -->
  <g transform="translate(540, 260)">
    <circle cx="0" cy="-22" r="14" fill="none" stroke="#C5A059" stroke-width="1.5" />
    <circle cx="0" cy="-22" r="3.5" fill="#5C1D38" />
    <text x="0" y="14" class="story-brand" text-anchor="middle">NAVA CREATIONS</text>
    <text x="0" y="44" font-family="'DM Sans', sans-serif" font-size="14px" font-weight="600" letter-spacing="0.32em" fill="#78716C" text-anchor="middle">ATELIER BENGALURU</text>
  </g>

  <!-- Center Image Window with Arch Architectural Frame -->
  <g transform="translate(540, 800)">
    <!-- Arch Border -->
    <path d="M -360 400 L -360 -180 C -360 -380, 360 -380, 360 -180 L 360 400 Z" fill="#FAF6F0" stroke="#E7E5E4" stroke-width="2" />
    <path d="M -344 384 L -344 -180 C -344 -364, 344 -364, 344 -180 L 344 384 Z" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

    <!-- Visual Jewelry Centerpiece Inside Arch -->
    <g transform="translate(0, 40)">
      <ellipse cx="0" cy="120" rx="260" ry="45" fill="#EAE5DF" opacity="0.6" />

      <!-- Broad Kada Top -->
      <ellipse cx="0" cy="-60" rx="220" ry="60" fill="none" stroke="#D4AF37" stroke-width="28" />
      <ellipse cx="0" cy="-60" rx="220" ry="60" fill="none" stroke="#5C1D38" stroke-width="8" />
      <circle cx="-160" cy="-60" r="7" fill="#FFFFFF" />
      <circle cx="0" cy="-18" r="8" fill="#FFFFFF" />
      <circle cx="160" cy="-60" r="7" fill="#FFFFFF" />

      <!-- Silk Bangles Red & Emerald -->
      <ellipse cx="0" cy="-15" rx="212" ry="58" fill="none" stroke="#8B263E" stroke-width="16" />
      <ellipse cx="0" cy="20" rx="210" ry="57" fill="none" stroke="#C5A059" stroke-width="10" stroke-dasharray="4 4" />
      <ellipse cx="0" cy="55" rx="208" ry="56" fill="none" stroke="#173E2E" stroke-width="16" />

      <!-- Broad Kada Bottom -->
      <ellipse cx="0" cy="100" rx="220" ry="60" fill="none" stroke="#D4AF37" stroke-width="28" />
      <ellipse cx="0" cy="100" rx="220" ry="60" fill="none" stroke="#5C1D38" stroke-width="8" />
      <circle cx="-160" cy="100" r="7" fill="#FFFFFF" />
      <circle cx="0" cy="142" r="8" fill="#FFFFFF" />
      <circle cx="160" cy="100" r="7" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Editorial Narrative Bottom -->
  <g transform="translate(540, 1380)">
    <text x="0" y="0" class="story-title">Bespoke Bridal Sizing</text>
    <text x="0" y="55" class="story-sub">Because your wedding bangles should never pinch or slip.</text>
    <text x="0" y="90" class="story-sub">Tailored to exact millimeter diameter in our Bengaluru atelier.</text>
  </g>

  <!-- Interactive Link Sticker (Instagram Native UI) -->
  <g transform="translate(540, 1580)">
    <rect x="-240" y="-35" width="480" height="70" rx="35" fill="#FFFFFF" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.12))" stroke="#E7E5E4" />
    <circle cx="-180" cy="0" r="20" fill="#E8F0FE" />
    <text x="-180" y="8" font-size="20px" text-anchor="middle">🔗</text>
    <text x="30" y="8" class="sticker-text">SHOP.NAVACREATIONS.IN</text>
  </g>

  <!-- Swipe Up Arrow -->
  <g transform="translate(540, 1780)">
    <path d="M -15 10 L 0 -5 L 15 10" stroke="#5C1D38" stroke-width="3" stroke-linecap="round" fill="none" />
    <text x="0" y="45" font-family="'DM Sans', sans-serif" font-size="16px" font-weight="600" letter-spacing="0.25em" fill="#5C1D38" text-anchor="middle">SWIPE UP TO CUSTOMISE</text>
  </g>
</svg>
