<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <path id="textArcTop" d="M 45 150 A 105 105 0 0 1 255 150" fill="none" />
    <path id="textArcBottom" d="M 255 150 A 105 105 0 0 1 45 150" fill="none" />
    <style>
      .seal-text { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-size: 19px; font-weight: 600; letter-spacing: 0.22em; fill: #5C1D38; }
      .seal-sub { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.35em; fill: #C5A059; }
      .botanical-stroke { fill: none; stroke: #C5A059; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Outer Concentric Bangle Borders -->
  <circle cx="150" cy="150" r="142" fill="#FDFBF7" stroke="#5C1D38" stroke-width="2.5" />
  <circle cx="150" cy="150" r="134" fill="none" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="3 3" />
  <circle cx="150" cy="150" r="82" fill="none" stroke="#C5A059" stroke-width="1.2" />

  <!-- Circular Text Along Path -->
  <text class="seal-text">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">NAVA CREATIONS</textPath>
  </text>
  <text class="seal-sub">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">★ BENGALURU ★</textPath>
  </text>

  <!-- Inner Parijata Botanical Motif -->
  <g transform="translate(150, 150) scale(0.85)">
    <circle cx="0" cy="0" r="4.5" fill="#5C1D38" stroke="#C5A059" stroke-width="1.8" />
    <path class="botanical-stroke" d="M 0 -4.5 C -6 -16, -2 -26, 0 -30 C 2 -26, 6 -16, 0 -4.5 Z" />
    <path class="botanical-stroke" d="M 4 -2 C 16 -8, 25 -4, 28 -1 C 24 3, 15 4, 4 -2 Z" />
    <path class="botanical-stroke" d="M 3 3 C 12 12, 18 20, 17 24 C 13 23, 7 15, 3 3 Z" />
    <path class="botanical-stroke" d="M -3 3 C -12 12, -18 20, -17 24 C -13 23, -7 15, -3 3 Z" />
    <path class="botanical-stroke" d="M -4 -2 C -16 -8, -25 -4, -28 -1 C -24 3, -15 4, -4 -2 Z" />
    <circle cx="0" cy="-18" r="1.8" fill="#C5A059" />
  </g>
</svg>
