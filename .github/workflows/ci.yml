name: NAVA CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Configure Deterministic Store
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install Dependencies (Strict Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client Artifacts
        run: pnpm run db:generate

      - name: Validate PostgreSQL Schema Integrity
        run: pnpm run db:validate

      - name: Lint Monorepo Codebase
        run: pnpm run lint

      - name: TypeScript Strict Mode Typecheck
        run: pnpm run typecheck

      - name: Execute Vitest Domain & Shared Unit Tests
        run: pnpm run test

      - name: Compile Next.js Production Build
        run: pnpm run build

      - name: Install Playwright Chromium Browser
        run: pnpm --filter @nava/web exec playwright install --with-deps chromium

      - name: Execute E2E Smoke Tests
        run: pnpm run test:e2e -- --project=chromium
