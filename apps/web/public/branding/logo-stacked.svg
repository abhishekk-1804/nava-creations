<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <defs>
    <style>
      .serif-title { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-size: 56px; font-weight: 500; letter-spacing: 0.16em; fill: #5C1D38; text-anchor: middle; }
      .sans-sub { font-family: 'DM Sans', 'Jost', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0.42em; fill: #C5A059; text-anchor: middle; }
      .botanical-stroke { fill: none; stroke: #C5A059; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Centered Botanical Motif (Center x=200, y=95) -->
  <g transform="translate(200, 95)">
    <!-- Bangle Ring Atmosphere -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.65" />

    <!-- Central Flower -->
    <circle cx="0" cy="0" r="4.5" fill="#5C1D38" stroke="#C5A059" stroke-width="1.8" />
    <path class="botanical-stroke" d="M 0 -4.5 C -7 -18, -3 -28, 0 -34 C 3 -28, 7 -18, 0 -4.5 Z" />
    <path class="botanical-stroke" d="M 4 -2 C 18 -9, 28 -5, 32 -1 C 27 4, 17 5, 4 -2 Z" />
    <path class="botanical-stroke" d="M 3 3 C 14 14, 20 22, 19 27 C 15 26, 8 17, 3 3 Z" />
    <path class="botanical-stroke" d="M -3 3 C -14 14, -20 22, -19 27 C -15 26, -8 17, -3 3 Z" />
    <path class="botanical-stroke" d="M -4 -2 C -18 -9, -28 -5, -32 -1 C -27 4, -17 5, -4 -2 Z" />
    <circle cx="0" cy="-20" r="1.8" fill="#C5A059" />

    <!-- Stem and Leaves -->
    <path class="botanical-stroke" d="M 0 35 C 15 31, 26 35, 31 43 C 20 45, 9 41, 0 35 Z" />
    <path class="botanical-stroke" d="M -1 50 C -16 47, -25 52, -29 59 C -19 61, -8 57, -1 50 Z" />
  </g>

  <!-- Centered Wordmark -->
  <text x="200" y="235" class="serif-title">NAVA</text>

  <!-- Decorative Hairline and Gem -->
  <line x1="80" y1="256" x2="320" y2="256" stroke="#C5A059" stroke-width="1.2" />
  <circle cx="200" cy="256" r="3" fill="#5C1D38" stroke="#C5A059" stroke-width="1.2" />

  <!-- Sub-wordmark -->
  <text x="204" y="286" class="sans-sub">CREATIONS</text>
  <text x="200" y="316" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" letter-spacing="0.25em" fill="#57534E" text-anchor="middle">BENGALURU • EST. 2026</text>
</svg>
