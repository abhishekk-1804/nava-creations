<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <style>
      .brand-plum { fill: #5C1D38; }
      .brand-gold { fill: #C5A059; stroke: #C5A059; }
      .serif-title { font-family: 'Cormorant Garamond', 'Playfair Display', 'Didot', 'Cinzel', serif; font-size: 54px; font-weight: 500; letter-spacing: 0.12em; fill: #5C1D38; }
      .sans-sub { font-family: 'DM Sans', 'Jost', 'Inter', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 0.38em; fill: #C5A059; }
      .botanical-stroke { fill: none; stroke: #C5A059; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .botanical-fill { fill: #5C1D38; }
      .gold-accent { fill: #C5A059; }
    </style>
  </defs>

  <!-- Left Icon: Elegant Parijata Botanical Crest (Center at x=90, y=80) -->
  <g transform="translate(15, 0)">
    <!-- Central Delicate Stem / Vine -->
    <path class="botanical-stroke" d="M 75 125 C 72 105, 82 85, 75 60 C 70 42, 60 35, 75 25" />
    <!-- Stylized Parijata 5-Petal Flower Motif -->
    <g transform="translate(75, 55)">
      <!-- Central Core / Bangle Seed Bead -->
      <circle cx="0" cy="0" r="4.5" fill="#5C1D38" stroke="#C5A059" stroke-width="1.8" />

      <!-- Top Petal -->
      <path class="botanical-stroke" d="M 0 -4.5 C -6 -16, -2 -26, 0 -30 C 2 -26, 6 -16, 0 -4.5 Z" />
      <!-- Top Right Petal -->
      <path class="botanical-stroke" d="M 4 -2 C 16 -8, 25 -4, 28 -1 C 24 3, 15 4, 4 -2 Z" />
      <!-- Bottom Right Petal -->
      <path class="botanical-stroke" d="M 3 3 C 12 12, 18 20, 17 24 C 13 23, 7 15, 3 3 Z" />
      <!-- Bottom Left Petal -->
      <path class="botanical-stroke" d="M -3 3 C -12 12, -18 20, -17 24 C -13 23, -7 15, -3 3 Z" />
      <!-- Top Left Petal -->
      <path class="botanical-stroke" d="M -4 -2 C -16 -8, -25 -4, -28 -1 C -24 3, -15 4, -4 -2 Z" />

      <!-- Subtle Kundan Accent Seed In Top Petal -->
      <circle cx="0" cy="-18" r="1.8" fill="#C5A059" />
    </g>

    <!-- Side Leaf Sprigs (Echoing Traditional Karnataka Border Embroidery) -->
    <path class="botanical-stroke" d="M 75 88 C 88 84, 98 88, 102 96 C 92 98, 82 94, 75 88 Z" />
    <path class="botanical-stroke" d="M 74 105 C 60 102, 52 107, 48 114 C 58 116, 68 112, 74 105 Z" />

    <!-- Subtle Golden Bangle Arc Behind Flower -->
    <circle cx="75" cy="78" r="48" fill="none" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.65" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="165" y1="35" x2="165" y2="125" stroke="#E7E5E4" stroke-width="1.2" />

  <!-- Typography Lockup (Horizontal Alignment) -->
  <g transform="translate(195, 0)">
    <!-- Brand Primary Wordmark: NAVA -->
    <text x="0" y="82" class="serif-title">NAVA</text>

    <!-- Decorative Gold Accent Line Under NAVA -->
    <line x1="2" y1="96" x2="310" y2="96" stroke="#C5A059" stroke-width="1.2" />
    <circle cx="156" cy="96" r="2.8" fill="#5C1D38" stroke="#C5A059" stroke-width="1.2" />

    <!-- Descriptor / Sub-wordmark: CREATIONS -->
    <text x="6" y="118" class="sans-sub">CREATIONS</text>
    <text x="215" y="118" class="sans-sub" font-size="10" letter-spacing="0.25em" fill="#57534E">• BENGALURU</text>
  </g>
</svg>
