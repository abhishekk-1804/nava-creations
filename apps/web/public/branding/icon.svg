<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <style>
      .botanical-stroke { fill: none; stroke: #C5A059; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Background Bangle Glow -->
  <circle cx="80" cy="80" r="74" fill="#FDFBF7" stroke="#5C1D38" stroke-width="1.8" />
  <circle cx="80" cy="80" r="68" fill="none" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Botanical Parijata Flower Motif -->
