    <circle cx="0" cy="0" r="5" fill="#5C1D38" stroke="#C5A059" stroke-width="2" />
    <path class="botanical-stroke" d="M 0 -5 C -7 -18, -3 -29, 0 -34 C 3 -29, 7 -18, 0 -5 Z" />
    <path class="botanical-stroke" d="M 4 -2 C 18 -9, 28 -5, 32 -1 C 27 4, 17 5, 4 -2 Z" />
    <path class="botanical-stroke" d="M 3 3 C 14 14, 20 22, 19 27 C 15 26, 8 17, 3 3 Z" />
    <path class="botanical-stroke" d="M -3 3 C -14 14, -20 22, -19 27 C -15 26, -8 17, -3 3 Z" />
    <path class="botanical-stroke" d="M -4 -2 C -18 -9, -28 -5, -32 -1 C -27 4, -17 5, -4 -2 Z" />
    <circle cx="0" cy="-20" r="2" fill="#C5A059" />
  </g>
</svg>
